[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "docpipe-sdk"
version = "0.6.0"
description = "Unified document parsing, structured extraction, vector ingestion, and RAG pipeline SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sunny Sinha", email = "thesunnysinha@gmail.com" }]
keywords = ["document", "parsing", "extraction", "llm", "pipeline", "vector", "ingestion", "rag", "docling", "langextract", "langchain", "pgvector", "turbovec", "embeddings", "retrieval", "opentelemetry", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
markitdown = ["markitdown>=0.1"]
glm-ocr = ["glmocr>=0.1"]
pymupdf = ["pymupdf4llm>=0.0.17"]
mineru = ["mineru>=2.0"]
paddleocr = ["paddleocr>=3.0"]
unstructured = ["unstructured[all-docs]>=0.16"]
autogen = ["autogen-agentchat>=0.4", "autogen-ext[openai]>=0.4"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
langextract = ["langextract>=0.1"]
outlines = ["outlines>=0.1"]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.3"]
huggingface = ["langchain-huggingface>=0.1"]
pgvector = ["langchain-postgres>=0.0.12", "psycopg2-binary>=2.9"]
turbovec = ["turbovec[langchain]>=0.1"]
semchunk = ["semchunk>=2.0"]
chonkie = ["chonkie>=1.0"]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "jinja2>=3.1",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
phoenix = ["arize-phoenix>=5.0"]
http = ["httpx>=0.27"]
rag = ["langchain-community>=0.3", "langchain-classic>=0.1", "rank-bm25>=0.2"]
rerank = ["flashrank>=0.2"]
rerank-quality = ["sentence-transformers>=3.0", "cohere>=5.0"]
eval-ragas = ["ragas>=0.4", "datasets>=3.0"]
eval-ci = ["deepeval>=1.0"]
lightrag = ["lightrag-hku>=1.0"]
# Curated install profiles (operators pick one)
profile-slim = [
    "docpipe-sdk[markitdown,semchunk,rerank,server,observability,http,openai,pgvector]",
]
profile-balanced = [
    "docpipe-sdk[profile-slim,docling,rag,langextract]",
]
profile-quality = [
    "docpipe-sdk[profile-balanced,glm-ocr,rerank-quality,chonkie]",
]
profile-agents = [
    "docpipe-sdk[profile-balanced,autogen]",
]
profile-eval = [
    "docpipe-sdk[profile-balanced,eval-ragas]",
]
profile-eval-ci = [
    "docpipe-sdk[profile-eval,eval-ci]",
]
profile-gpu = [
    "docpipe-sdk[profile-quality,mineru,paddleocr]",
]
# Dev/CI only — not recommended for production images
all = [
    "docpipe-sdk[profile-balanced,profile-quality,profile-agents,profile-eval,turbovec,anthropic,google,ollama,huggingface,langgraph,outlines,lightrag,unstructured,pymupdf]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",
    "fastapi>=0.100",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.1.0",
]

[project.scripts]
docpipe = "docpipe.cli.main:cli"

[project.entry-points."docpipe.parsers"]
docling = "docpipe.parsers.docling_parser:DoclingParser"
markitdown = "docpipe.parsers.markitdown_parser:MarkItDownParser"
glm-ocr = "docpipe.parsers.glm_ocr_parser:GLMOCRParser"
pymupdf = "docpipe.parsers.pymupdf_parser:PyMuPDFParser"
mineru = "docpipe.parsers.mineru_parser:MinerUParser"
paddleocr = "docpipe.parsers.paddleocr_parser:PaddleOCRParser"
unstructured = "docpipe.parsers.unstructured_parser:UnstructuredParser"

[project.entry-points."docpipe.extractors"]
langextract = "docpipe.extractors.langextract_extractor:LangExtractExtractor"
langchain = "docpipe.extractors.langchain_extractor:LangChainExtractor"
outlines = "docpipe.extractors.outlines_extractor:OutlinesExtractor"

[project.entry-points."docpipe.chunkers"]
recursive = "docpipe.chunkers.recursive_chunker:RecursiveChunker"
semchunk = "docpipe.chunkers.semchunk_chunker:SemchunkChunker"
chonkie-semantic = "docpipe.chunkers.chonkie_chunker:ChonkieSemanticChunker"
chonkie-late = "docpipe.chunkers.chonkie_chunker:ChonkieLateChunker"

[project.entry-points."docpipe.rerankers"]
flashrank = "docpipe.rerankers.flashrank_reranker:FlashRankReranker"
cohere = "docpipe.rerankers.cohere_reranker:CohereReranker"
bge = "docpipe.rerankers.bge_reranker:BGEReranker"
mxbai = "docpipe.rerankers.mxbai_reranker:MxbaiReranker"

[project.entry-points."docpipe.evaluators"]
builtin = "docpipe.eval.builtin_evaluator:BuiltinEvaluator"
ragas = "docpipe.eval.ragas_evaluator:RagasEvaluator"

[project.urls]
Homepage = "https://docpipe.sunnysinha.online"
Documentation = "https://docpipe.sunnysinha.online"
Repository = "https://github.com/thesunnysinha/docpipe"
"Bug Tracker" = "https://github.com/thesunnysinha/docpipe/issues"
Changelog = "https://github.com/thesunnysinha/docpipe/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/docpipe"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "requires_docling: needs docling installed",
    "requires_langextract: needs langextract installed",
    "requires_langchain: needs langchain provider installed",
    "requires_pgvector: needs pgvector DB available",
    "requires_api_key: needs LLM API key configured",
    "requires_rag: needs rag extra, DB, and API key available",
    "requires_turbovec: needs docpipe-sdk[turbovec] installed",
    "requires_markitdown: needs docpipe-sdk[markitdown] installed",
    "requires_autogen: needs docpipe-sdk[autogen] installed",
    "requires_semchunk: needs docpipe-sdk[semchunk] installed",
    "requires_ragas: needs docpipe-sdk[eval-ragas] installed",
]
