# pgvector stack + Adminer for browsing Postgres.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d

x-docpipe-resources: &docpipe-resources
  deploy:
    resources:
      limits:
        cpus: "4.0"
        memory: 4G

services:
  docpipe:
    image: ghcr.io/thesunnysinha/docpipe:${DOPIPE_IMAGE_TAG:-balanced}
    ports:
      - "${DOCPIPE_HOST_PORT:-8000}:8000"
    env_file: .env
    <<: *docpipe-resources
    environment:
      DOCPIPE_DB_CONNECTION_STRING: postgresql://docpipe:docpipe@db:5432/docpipe
      DOCPIPE_CONTROL_DB_ENABLED: "${DOCPIPE_CONTROL_DB_ENABLED:-true}"
      DOCPIPE_CONTROL_DB_PATH: /data/docpipe.db
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docpipe
      POSTGRES_PASSWORD: docpipe
      POSTGRES_DB: docpipe
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpipe"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
