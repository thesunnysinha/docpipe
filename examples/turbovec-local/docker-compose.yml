# File-based vectors (turbovec) — no Postgres container.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# On ingest, pass:
#   "vector_backend": "turbovec",
#   "turbovec_index_dir": "/data/indices"

services:
  docpipe:
    image: ghcr.io/thesunnysinha/docpipe:${DOPIPE_IMAGE_TAG:-balanced}
    ports:
      - "${DOCPIPE_HOST_PORT:-8000}:8000"
    env_file: .env
    environment:
      DOCPIPE_VECTOR_BACKEND: turbovec
      DOCPIPE_TURBVEC_INDEX_DIR: /data/indices
      DOCPIPE_CONTROL_DB_ENABLED: "${DOCPIPE_CONTROL_DB_ENABLED:-true}"
      DOCPIPE_CONTROL_DB_PATH: /data/docpipe.db
    volumes:
      - ./data:/data
    restart: unless-stopped
