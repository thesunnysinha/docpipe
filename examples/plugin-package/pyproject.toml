[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "example-docpipe-plugin"
version = "0.1.0"
description = "In-memory example vector plugin for Docpipe authors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["docpipe-sdk>=0.6"]

[project.entry-points."docpipe.vectorstores"]
example-memory = "example_docpipe_plugin:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/example_docpipe_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"docpipe-plugin.json" = "example_docpipe_plugin-0.1.0.dist-info/docpipe-plugin.json"
