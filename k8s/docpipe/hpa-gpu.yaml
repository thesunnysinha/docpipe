apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docpipe-gpu
  namespace: docpipe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docpipe-gpu
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
