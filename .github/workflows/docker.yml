name: Docker

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [slim, balanced, quality, agents]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.profile }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=raw,value=${{ matrix.profile }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.profile == 'balanced' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' && matrix.profile == 'balanced' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && matrix.profile == 'balanced' }}
            type=semver,pattern={{version}}-${{ matrix.profile }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ matrix.profile }}-${{ github.ref_name }},enable=${{ github.event_name == 'release' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DOPIPE_PROFILE=${{ matrix.profile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
